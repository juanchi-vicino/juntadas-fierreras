<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juntadas Fierreras | Ingresar</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-cars">
    
    <div class="glass-container">
        <!-- Logo -->
        <div class="logo-container">
            <img src="img/plantellogo.webp" alt="Logo" class="logo-index">
        </div>

        <!-- Formulario de Login -->
        <form id="loginForm" class="auth-form active">
            <h2>Iniciar Sesión</h2>
            <div class="input-group">
                <input type="text" id="loginUser" required placeholder=" ">
                <label>Usuario</label>
            </div>
            <div class="input-group">
                <input type="password" id="loginPass" required placeholder=" ">
                <label>Contraseña</label>
            </div>
            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Recordarme
                </label>
            </div>
            <button type="submit" class="btn-primary">1era a fondo</button>
            <p class="switch-form">¿No tenés cuenta? <span onclick="toggleForms()">Registrate</span></p>
        </form>

        <!-- Formulario de Registro (Oculto por defecto) -->
        <form id="registerForm" class="auth-form hidden">
            <h2>Nuevo Integrante</h2>
            <div class="input-group">
                <input type="text" id="regUser" required placeholder=" ">
                <label>Nombre de usuario</label>
            </div>
            <div class="input-group">
                <input type="password" id="regPass" required placeholder=" ">
                <label>Contraseña</label>
            </div>
            <div class="input-group">
                <input type="password" id="regPassConfirm" required placeholder=" ">
                <label>Confirmar contraseña</label>
            </div>
            <div class="file-group">
                <label>Foto de Perfil (Obligatoria)</label>
                <input type="file" id="regPic" accept="image/*" required>
            </div>
            <button type="submit" class="btn-primary">Registrarse</button>
            <p class="switch-form">¿Ya sos miembro? <span onclick="toggleForms()">Iniciá Sesión</span></p>
        </form>
    </div>

    <!-- ========================================== -->
    <!-- ACÁ ESTÁN LOS SCRIPTS EN EL ORDEN CORRECTO -->
    <!-- ========================================== -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
