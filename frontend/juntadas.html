<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juntadas | Juntadas Fierreras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cars layout-app">

    <!-- HEADER (Igual al de inicio) -->
    <header class="glass-header">
        <div class="header-content">
            <img src="img/plantelplano.webp" alt="Logo" class="header-logo">
            <button class="hamburger-btn" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-links" id="navMenu">
                <a href="inicio.html">Inicio</a>
                <a href="juntadas.html" class="active">Próximas Juntadas</a>
                <a href="integrantes.html">Integrantes</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <!-- FORMULARIO CREAR JUNTADA -->
        <section class="glass-card mb-30">
            <h2>Crear nueva Juntada</h2>
            <form id="createMeetForm" class="form-grid">
                <div class="input-group">
                    <input type="text" id="meetPlace" required placeholder=" ">
                    <label>Lugar (Ej: YPF Acceso Norte)</label>
                </div>
                <div class="input-group">
                    <input type="datetime-local" id="meetDate" required>
                </div>
                <div class="input-group">
                    <input type="text" id="meetDesc" placeholder=" ">
                    <label>Descripción / Reglas (Opcional)</label>
                </div>
                <div class="file-group">
                    <label>Flyer o Imagen (Opcional)</label>
                    <input type="file" id="meetImage" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Organizar</button>
            </form>
        </section>

        <!-- CONTENEDOR DE TARJETAS -->
        <section id="meetsContainer" class="meets-grid"></section>
    </main>

    <!-- MODAL DE ASISTENCIA -->
    <div id="modalAsistencia" class="modal-overlay hidden">
        <div class="glass-card modal-content">
            <h2>¿Asistirás a la juntada?</h2>
            <form id="attendanceForm">
                <input type="hidden" id="currentMeetId">
                <div class="radio-group">
                    <label><input type="radio" name="status" value="SI" required onchange="toggleReason(false)"> SÍ, TOY</label>
                    <label><input type="radio" name="status" value="NO" required onchange="toggleReason(true)"> NO PUEDO</label>
                </div>
                <div class="input-group hidden" id="reasonGroup">
                    <input type="text" id="meetReason" placeholder=" ">
                    <label>¿Por qué no venís? (Motivo)</label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModals()">Cancelar</button>
                    <button type="submit" class="btn-primary">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CONFIRMADOS -->
    <div id="modalConfirmados" class="modal-overlay hidden">
        <div class="glass-card modal-content list-modal">
            <h2>Lista de Integrantes</h2>
            <div id="confirmadosList" class="users-list">
                <!-- Se llena con JS -->
            </div>
            <button type="button" class="btn-primary mt-20" onclick="closeModals()">Cerrar</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/juntadas.js"></script>
    <script>

        function toggleMenu() {
        const menu = document.getElementById('navMenu');
        menu.classList.toggle('show');
        // Cerrar sesión
        function logout() {
        localStorage.removeItem('user');
        window.location.href = 'index.html';
        }

        }
    </script>
</body>
<footer class="main-footer">
    <p>&copy; 2026 Juanchi Vicino. Todos los derechos reservados.</p>
</footer>
</html>
